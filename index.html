    <!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Hand AR Effect v2</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #000; height: 100%; font-family: sans-serif;
  }
  #stage {
    position: relative; width: 100vw; height: 100vh;
    transform: scaleX(-1); /* mirror biar kaya kaca */
  }
  video, #three-canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #three-canvas { pointer-events: none; }
  #status {
    position: absolute; top: 10px; left: 10px;
    color: #0f0; font-size: 13px; background: rgba(0,0,0,.5);
    padding: 6px 10px; border-radius: 6px; z-index: 10;
    transform: scaleX(-1); /* biar teksnya gak kebalik */
  }
  #hint {
    position: absolute; bottom: 14px; width: 100%;
    text-align: center; color: #aaa; font-size: 12px; z-index: 10;
  }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline></video>
  <canvas id="three-canvas"></canvas>
</div>
<div id="status">Memuat model tangan...</div>
<div id="hint">✋ tangan terbuka → bunga mekar &nbsp;|&nbsp; ✊ dikepal → naga energi</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js" crossorigin="anonymous"></script>
<script>
const videoEl = document.getElementById('video');
const canvasEl = document.getElementById('three-canvas');
const statusEl = document.getElementById('status');

let W = window.innerWidth, H = window.innerHeight;

// ---------- THREE.JS SETUP ----------
const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, alpha: true, antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(window.devicePixelRatio || 1);

const scene = new THREE.Scene();

// kamera orthographic: 1 unit = 1 pixel layar, origin kiri-atas
const camera = new THREE.OrthographicCamera(0, W, 0, H, -1000, 1000);
camera.position.z = 500;

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const pLight = new THREE.PointLight(0xffffff, 1.2);
pLight.position.set(0, 0, 400);
scene.add(pLight);

window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  camera.right = W; camera.bottom = H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
});

// ---------- WIREFRAME BOX (indikator tracking) ----------
function makeWireBox() {
  const group = new THREE.Group();
  const mat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
  const boxGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1));
  const box = new THREE.LineSegments(boxGeo, mat);
  group.add(box);
  return group;
}
const wireBox = makeWireBox();
scene.add(wireBox);

// ---------- BUNGA (3D flower) ----------
function makeFlower() {
  const group = new THREE.Group();
  const petalMat = new THREE.MeshStandardMaterial({ color: 0xff5c8a, side: THREE.DoubleSide, emissive: 0x330011 });
  const centerMat = new THREE.MeshStandardMaterial({ color: 0xffd23f, emissive: 0x554400 });
  const stemMat = new THREE.MeshStandardMaterial({ color: 0x3ba55d });

  const petalCount = 7;
  for (let i = 0; i < petalCount; i++) {
    const petal = new THREE.Mesh(new THREE.ConeGeometry(14, 34, 8), petalMat);
    const angle = (i / petalCount) * Math.PI * 2;
    petal.position.set(Math.cos(angle) * 16, Math.sin(angle) * 16, 0);
    petal.rotation.z = angle + Math.PI / 2;
    petal.rotation.x = Math.PI / 2.4;
    group.add(petal);
  }
  const center = new THREE.Mesh(new THREE.SphereGeometry(11, 16, 16), centerMat);
  group.add(center);

  const stem = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 60, 8), stemMat);
  stem.position.set(0, 40, -10);
  group.add(stem);

  group.scale.set(0.001, 0.001, 0.001);
  return group;
}
const flower = makeFlower();
scene.add(flower);

// ---------- NAGA ENERGI (energy dragon) ----------
function makeDragon() {
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0xff2200, emissive: 0xff3300, emissiveIntensity: 0.9, roughness: 0.4
  });
  const wingMat = new THREE.MeshStandardMaterial({
    color: 0xff5522, transparent: true, opacity: 0.55, side: THREE.DoubleSide, emissive: 0x552200
  });

  // badan berkelok pakai kurva S
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-70, 20, 0),
    new THREE.Vector3(-35, -15, 10),
    new THREE.Vector3(0, 15, -10),
    new THREE.Vector3(35, -10, 10),
    new THREE.Vector3(70, 10, 0),
  ]);
  const tubeGeo = new THREE.TubeGeometry(curve, 40, 6, 8, false);
  const body = new THREE.Mesh(tubeGeo, bodyMat);
  group.add(body);

  // kepala
  const head = new THREE.Mesh(new THREE.ConeGeometry(10, 22, 8), bodyMat);
  head.position.set(-82, 26, 0);
  head.rotation.z = Math.PI / 2.2;
  group.add(head);

  // sayap
  const wingShape = new THREE.Shape();
  wingShape.moveTo(0, 0);
  wingShape.quadraticCurveTo(30, 25, 55, 10);
  wingShape.quadraticCurveTo(35, 5, 30, -5);
  wingShape.quadraticCurveTo(15, -2, 0, 0);
  const wingGeo = new THREE.ShapeGeometry(wingShape);

  const wingL = new THREE.Mesh(wingGeo, wingMat);
  wingL.position.set(-10, 5, 5);
  wingL.rotation.y = 0.3;
  group.add(wingL);

  const wingR = wingL.clone();
  wingR.position.set(-10, 5, -5);
  wingR.rotation.y = -0.3 + Math.PI;
  wingR.scale.x = -1;
  group.add(wingR);

  group.scale.set(0.001, 0.001, 0.001);
  return group;
}
const dragon = makeDragon();
scene.add(dragon);

// ---------- helper animasi lerp scale ----------
function lerpScale(obj, target, speed) {
  const s = obj.scale.x + (target - obj.scale.x) * speed;
  obj.scale.set(s, s, s);
}

let flowerTarget = 0, dragonTarget = 0, boxTarget = 0;
let clock = new THREE.Clock();

// ---------- MEDIAPIPE HANDS ----------
function isFist(landmarks) {
  const tips = [8, 12, 16, 20];
  const pips = [6, 10, 14, 18];
  let curled = 0;
  for (let i = 0; i < tips.length; i++) {
    if (landmarks[tips[i]].y > landmarks[pips[i]].y) curled++;
  }
  return curled >= 3;
}
function isOpenHand(landmarks) {
  const tips = [8, 12, 16, 20];
  const pips = [6, 10, 14, 18];
  let extended = 0;
  for (let i = 0; i < tips.length; i++) {
    if (landmarks[tips[i]].y < landmarks[pips[i]].y) extended++;
  }
  return extended >= 4;
}

let handPos = null;
let handBox = null;

function onResults(results) {
  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    const lm = results.multiHandLandmarks[0];
    const wrist = lm[0];
    const x = wrist.x * W;
    const y = wrist.y * H;
    handPos = { x, y };

    let minX = 1, maxX = 0, minY = 1, maxY = 0;
    lm.forEach(p => {
      minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
      minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
    });
    handBox = {
      w: (maxX - minX) * W * 1.4,
      h: (maxY - minY) * H * 1.4,
    };
    boxTarget = 1;

    if (isFist(lm)) {
      dragonTarget = 1; flowerTarget = 0;
      statusEl.textContent = 'Naga energi muncul ✊';
    } else if (isOpenHand(lm)) {
      flowerTarget = 1; dragonTarget = 0;
      statusEl.textContent = 'Bunga mekar ✋';
    } else {
      statusEl.textContent = 'Tangan terdeteksi';
    }
  } else {
    handPos = null;
    boxTarget = 0; flowerTarget = 0; dragonTarget = 0;
    statusEl.textContent = 'Tunjukkan tanganmu ke kamera';
  }
}

const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});
hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});
hands.onResults(onResults);

const camFeed = new Camera(videoEl, {
  onFrame: async () => { await hands.send({ image: videoEl }); },
  width: 640,
  height: 480
});
camFeed.start().catch(err => {
  statusEl.textContent = 'Gagal akses kamera: ' + err.message;
});

// ---------- RENDER LOOP ----------
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  if (handPos) {
    const targetPos = new THREE.Vector3(handPos.x, handPos.y, 0);
    [wireBox, flower, dragon].forEach(obj => obj.position.lerp(targetPos, 0.35));

    if (handBox) {
      wireBox.scale.set(
        wireBox.scale.x + (handBox.w - wireBox.scale.x) * 0.3,
        wireBox.scale.y + (handBox.h - wireBox.scale.y) * 0.3,
        wireBox.scale.z + (Math.max(handBox.w, handBox.h) - wireBox.scale.z) * 0.3
      );
    }
  }

  lerpScale(flower, flowerTarget, 0.12);
  lerpScale(dragon, dragonTarget, 0.12);

  flower.rotation.y = t * 0.6;
  flower.position.y += Math.sin(t * 2) * 0.15; // efek melayang halus

  dragon.rotation.y = Math.sin(t * 0.8) * 0.3;
  dragon.rotation.z = Math.sin(t * 1.3) * 0.08;

  const bOp = Math.min(boxTarget, 1);
  wireBox.children[0].material.opacity = 0.6 * bOp;

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
