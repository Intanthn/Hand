<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Tangan · Bunga & Galaksi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0b0b1a; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
    #wrap {
      position: relative;
      width: 100vw; height: 100vh;
      background: #000;
    }
    video { display: none; }
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform: scaleX(-1); /* mirror biar kaya kaca */
    }
    #status {
      position: absolute;
      top: 16px; left: 16px;
      color: #b7c9ff;
      font-size: 14px;
      background: rgba(10, 10, 30, 0.7);
      backdrop-filter: blur(4px);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
      pointer-events: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      letter-spacing: 0.3px;
    }
    #hint {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: rgba(200, 215, 255, 0.5);
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(0,20,80,0.5);
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="status">👋 tunjukkan tangan</div>
  <div id="hint">buka · kepal · 2 jari · putar</div>
</div>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
  (function() {
    const videoEl = document.getElementById('video');
    const canvasEl = document.getElementById('canvas');
    const ctx = canvasEl.getContext('2d');
    const statusEl = document.getElementById('status');

    function resizeCanvas() {
      canvasEl.width = window.innerWidth;
      canvasEl.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ---------- Particle System (Bunga/Galaksi) ----------
    class Particle3D {
      constructor(x, y, baseHue, type = 'flower') {
        this.x = x;
        this.y = y;
        this.type = type;
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.4 + Math.random() * 1.6;
        this.vx = Math.cos(angle) * speed * 0.5;
        this.vy = Math.sin(angle) * speed * 0.5 - 0.2;
        this.life = 0.8 + Math.random() * 0.5;
        this.decay = 0.004 + Math.random() * 0.012;
        this.size = 2 + Math.random() * 6;
        this.hue = baseHue + (Math.random() - 0.5) * 35;
        this.sat = 75 + Math.random() * 25;
        this.light = 55 + Math.random() * 35;
        this.glow = 0.3 + Math.random() * 0.5;
        this.phase = Math.random() * Math.PI * 2;
        this.orbitRadius = 0;
        this.orbitSpeed = 0;
        if (type === 'galaxy') {
          this.orbitRadius = 20 + Math.random() * 60;
          this.orbitSpeed = (0.01 + Math.random() * 0.03) * (Math.random() > 0.5 ? 1 : -1);
          this.size = 1.5 + Math.random() * 4;
        }
      }
      update(frame) {
        if (this.type === 'galaxy') {
          // orbit melingkar
          this.phase += this.orbitSpeed;
          this.x += Math.cos(this.phase) * this.orbitRadius * 0.005;
          this.y += Math.sin(this.phase) * this.orbitRadius * 0.005;
          this.life -= this.decay * 0.6;
        } else {
          // bunga: gerakan naik + spiral
          this.x += this.vx + Math.sin(frame * 0.02 + this.phase) * 0.15;
          this.y += this.vy + Math.cos(frame * 0.025 + this.phase) * 0.1;
          this.vy -= 0.015;
          this.vx *= 0.995;
          this.vy *= 0.995;
          this.life -= this.decay;
        }
        this.size *= 0.999;
      }
      draw(ctx) {
        const a = Math.max(this.life, 0) * this.glow;
        ctx.globalAlpha = a;
        ctx.shadowColor = `hsl(${this.hue}, 100%, 70%)`;
        ctx.shadowBlur = 22;
        ctx.fillStyle = `hsl(${this.hue}, ${this.sat}%, ${this.light}%)`;
        ctx.beginPath();
        if (this.type === 'galaxy') {
          // bintang galaksi
          const spikes = 4 + Math.floor(Math.random() * 2);
          const rad = Math.max(this.size * 1.2, 1);
          for (let i = 0; i < spikes * 2; i++) {
            const r = i % 2 === 0 ? rad : rad * 0.4;
            const angle = (i / (spikes * 2)) * Math.PI * 2 + this.phase;
            if (i === 0) ctx.moveTo(this.x + Math.cos(angle) * r, this.y + Math.sin(angle) * r);
            else ctx.lineTo(this.x + Math.cos(angle) * r, this.y + Math.sin(angle) * r);
          }
          ctx.closePath();
          ctx.fill();
          // core terang
          ctx.shadowBlur = 35;
          ctx.fillStyle = `hsla(${this.hue+20}, 100%, 90%, ${a*0.6})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, rad * 0.3, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // bunga: kelopak
          const petals = 5 + Math.floor(Math.random() * 3);
          const rad = Math.max(this.size, 1.5);
          for (let i = 0; i < petals * 2; i++) {
            const r = i % 2 === 0 ? rad : rad * 0.5;
            const angle = (i / (petals * 2)) * Math.PI * 2 + this.phase * 0.5;
            if (i === 0) ctx.moveTo(this.x + Math.cos(angle) * r, this.y + Math.sin(angle) * r);
            else ctx.lineTo(this.x + Math.cos(angle) * r, this.y + Math.sin(angle) * r);
          }
          ctx.closePath();
          ctx.fill();
          ctx.shadowBlur = 30;
          ctx.fillStyle = `hsla(${this.hue+30}, 100%, 85%, ${a*0.5})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, rad * 0.35, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.shadowBlur = 0;
      }
    }

    // ---------- state ----------
    let particles = [];
    let handPos = { x: window.innerWidth/2, y: window.innerHeight/2 };
    let handClosed = false;
    let twoFingersDown = false;
    let handRotation = 0;
    let gestureMode = 'open';
    let frameCount = 0;
    let currentHue = 190;
    let lastParticleTime = 0;

    // ----- analisis gestur -----
    function analyzeGesture(landmarks) {
      if (!landmarks || landmarks.length === 0) return { mode: 'none', closed: false, two: false, rot: 0 };

      const tips = [8, 12, 16, 20];
      const pips = [6, 10, 14, 18];
      let curled = 0;
      for (let i = 0; i < tips.length; i++) {
        if (landmarks[tips[i]].y > landmarks[pips[i]].y) curled++;
      }
      const indexDown = landmarks[8].y > landmarks[6].y;
      const middleDown = landmarks[12].y > landmarks[10].y;
      const twoDown = indexDown && middleDown;

      const wrist = landmarks[0];
      const midTip = landmarks[12];
      const dx = midTip.x - wrist.x;
      const dy = midTip.y - wrist.y;
      let rot = Math.atan2(dy, dx);

      return {
        closed: curled >= 3,
        two: twoDown,
        rot: rot,
        mode: curled >= 3 ? 'fist' : (twoDown ? 'two' : 'open')
      };
    }

    // ----- gambar scene utama (tanpa tangan) -----
    function drawMainScene(gesture, rot) {
      const w = canvasEl.width;
      const h = canvasEl.height;
      const cx = handPos.x;
      const cy = handPos.y;

      let baseSize = 100 + Math.sin(frameCount * 0.015) * 5;
      if (gesture === 'fist') baseSize = 75;
      else if (gesture === 'two') baseSize = 120;
      else baseSize = 140;

      const angle = rot + Math.PI/2;

      // warna berdasarkan gesture
      let hue = 190;
      if (gesture === 'fist') hue = 280;
      else if (gesture === 'two') hue = 340;
      else hue = 190 + Math.sin(frameCount * 0.02) * 15;
      currentHue = hue;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);

      // Glow latar
      const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, baseSize * 2);
      grad.addColorStop(0, `hsla(${hue}, 90%, 70%, 0.2)`);
      grad.addColorStop(0.5, `hsla(${hue+30}, 80%, 50%, 0.07)`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, baseSize * 2, 0, Math.PI*2);
      ctx.fill();

      // --- SHAPE UTAMA: BUNGA / GALAKSI ---
      const s = baseSize * 0.55;
      const layers = gesture === 'fist' ? 4 : (gesture === 'two' ? 5 : 6);

      for (let layer = 0; layer < layers; layer++) {
        const scale = 1 - layer * 0.12;
        const alpha = 0.25 + layer * 0.12;
        ctx.globalAlpha = alpha;
        const layerHue = hue + layer * 15 + (gesture === 'fist' ? 10 : 0);
        ctx.shadowColor = `hsl(${layerHue+20}, 100%, 70%)`;
        ctx.shadowBlur = 35 - layer * 3;

        // bentuk kelopak / bintang
        const petals = gesture === 'fist' ? 5 : (gesture === 'two' ? 7 : 8);
        ctx.strokeStyle = `hsl(${layerHue}, 85%, ${65 + layer * 5}%)`;
        ctx.lineWidth = 1.8 - layer * 0.15;
        ctx.beginPath();
        for (let i = 0; i < petals * 2; i++) {
          const r = i % 2 === 0 ? s * scale : s * scale * 0.4;
          const ang = (i / (petals * 2)) * Math.PI * 2 + frameCount * 0.003 + layer * 0.2;
          const px = Math.cos(ang) * r;
          const py = Math.sin(ang) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();

        // isi transparan
        ctx.fillStyle = `hsla(${layerHue}, 80%, 70%, ${0.05 + layer * 0.02})`;
        ctx.fill();
      }

      // spiral / galaksi di dalam
      for (let i = 0; i < 30; i++) {
        const t = i / 30;
        const ang = t * Math.PI * 4 + frameCount * 0.01;
        const rad = s * 0.2 + t * s * 0.7;
        const px = Math.cos(ang) * rad;
        const py = Math.sin(ang) * rad;
        ctx.globalAlpha = 0.15 + 0.1 * Math.sin(t * 10 + frameCount * 0.02);
        ctx.fillStyle = `hsl(${hue + 30 + i * 3}, 90%, 75%)`;
        ctx.shadowBlur = 15;
        ctx.shadowColor = `hsl(${hue+40}, 100%, 70%)`;
        ctx.beginPath();
        ctx.arc(px, py, 2 + t * 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // titik pusat
      ctx.globalAlpha = 0.9;
      ctx.shadowBlur = 60;
      ctx.shadowColor = `hsl(${hue}, 100%, 80%)`;
      ctx.fillStyle = `hsl(${hue}, 100%, 90%)`;
      ctx.beginPath();
      ctx.arc(0, 0, 10 + Math.sin(frameCount * 0.04) * 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();

      // --- spawn partikel ---
      const now = Date.now();
      if (now - lastParticleTime > 30) {
        const count = gesture === 'fist' ? 2 : (gesture === 'two' ? 3 : 4);
        const type = gesture === 'fist' ? 'galaxy' : 'flower';
        for (let i = 0; i < count; i++) {
          const ang2 = Math.random() * Math.PI * 2;
          const dist = baseSize * 0.4 * (0.5 + Math.random() * 0.6);
          const px = cx + Math.cos(ang2 + angle) * dist;
          const py = cy + Math.sin(ang2 + angle) * dist;
          const p = new Particle3D(px, py, hue + (Math.random() - 0.5) * 40, type);
          particles.push(p);
        }
        lastParticleTime = now;
      }
    }

    // ----- MediaPipe hasil -----
    function onResults(results) {
      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

      // 1. GAMBAR VIDEO (wajah) sebagai background
      if (results.image) {
        ctx.save();
        ctx.drawImage(results.image, 0, 0, canvasEl.width, canvasEl.height);
        ctx.restore();
      }

      // 2. Deteksi tangan
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        const wrist = lm[0];
        const x = wrist.x * canvasEl.width;
        const y = wrist.y * canvasEl.height;
        handPos.x = x;
        handPos.y = y;

        const gesture = analyzeGesture(lm);
        handClosed = gesture.closed;
        twoFingersDown = gesture.two;
        handRotation = gesture.rot;
        gestureMode = gesture.mode;

        let statusText = '';
        if (gestureMode === 'fist') statusText = '✊ kepalan · galaksi';
        else if (gestureMode === 'two') statusText = '✌️ 2 jari · bunga';
        else if (gestureMode === 'open') statusText = '🖐️ terbuka · bunga';
        statusEl.textContent = statusText + '  |  putar ↻';

        // gambar scene 3D di atas tangan (tanpa gambar tangan)
        drawMainScene(gestureMode, handRotation);

      } else {
        statusEl.textContent = '👋 tunjukkan tangan';
        // partikel ambient
        if (frameCount % 3 === 0) {
          const x = Math.random() * canvasEl.width;
          const y = Math.random() * canvasEl.height;
          const p = new Particle3D(x, y, 200 + Math.random()*40, 'flower');
          p.life = 0.5;
          p.size = 2;
          particles.push(p);
        }
      }

      // update & draw partikel
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => { p.update(frameCount); p.draw(ctx); });
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

      frameCount++;
    }

    // ----- inisialisasi MediaPipe -----
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.6
    });
    hands.onResults(onResults);

    const camera = new Camera(videoEl, {
      onFrame: async () => {
        try {
          await hands.send({ image: videoEl });
        } catch (e) {}
      },
      width: 640,
      height: 480
    });
    camera.start().catch(err => {
      statusEl.textContent = '⚠️ kamera error: ' + err.message;
    });

    // partikel awal
    for (let i = 0; i < 40; i++) {
      const p = new Particle3D(
        Math.random() * window.innerWidth,
        Math.random() * window.innerHeight,
        190 + Math.random()*60,
        'flower'
      );
      p.life = 0.2 + Math.random() * 0.3;
      p.size = 1.5 + Math.random() * 3;
      particles.push(p);
    }
  })();
</script>
</body>
</html>
