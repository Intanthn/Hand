<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR 2 Tangan · Animasi di Pojok + Rotate</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a12; overflow: hidden; font-family: 'Georgia', serif; }
    #wrap {
      position: relative;
      width: 100vw; height: 100vh;
      background: #0a0a12;
    }
    video {
      display: block;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform: scaleX(-1);
      object-fit: cover;
      z-index: 1;
    }
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform: scaleX(-1);
      z-index: 2;
      pointer-events: none;
    }
    #status {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 215, 215, 0.9);
      font-size: 13px;
      letter-spacing: 2px;
      background: rgba(10, 10, 20, 0.8);
      backdrop-filter: blur(10px);
      padding: 10px 28px;
      border-radius: 30px;
      border: 1px solid rgba(255, 200, 200, 0.15);
      z-index: 10;
      font-family: 'Georgia', serif;
      pointer-events: none;
      text-align: center;
      min-width: 200px;
    }
    #aesthetic-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 220, 220, 0.06);
      font-size: clamp(40px, 12vw, 120px);
      font-weight: 300;
      letter-spacing: 8px;
      text-align: center;
      z-index: 5;
      pointer-events: none;
      font-family: 'Georgia', serif;
      text-shadow: 0 0 60px rgba(255, 150, 200, 0.03);
      line-height: 1.2;
      white-space: nowrap;
    }
    #like-counter {
      position: absolute;
      bottom: 80px;
      right: 30px;
      color: rgba(255, 200, 200, 0.12);
      font-size: 14px;
      letter-spacing: 2px;
      z-index: 5;
      pointer-events: none;
      font-family: 'Georgia', serif;
    }
    #like-counter span { font-size: 20px; margin-right: 6px; }
    #frame-info {
      position: absolute;
      top: 30px;
      right: 30px;
      color: rgba(255, 200, 200, 0.08);
      font-size: 11px;
      letter-spacing: 1px;
      z-index: 5;
      pointer-events: none;
      font-family: 'Courier New', monospace;
      text-align: right;
      line-height: 1.8;
    }
  </style>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  
  <div id="aesthetic-text">✦ ETERNAL ✦</div>
  <div id="like-counter"><span>✦</span> 222.419</div>
  <div id="frame-info">
    Project1<br>
    (128,128) (139,786)<br>
    00:00:06:18
  </div>
  <div id="status">✧ tunjukkan tangan kananmu ✧</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
  (function() {
    const videoEl = document.getElementById('video');
    const canvasEl = document.getElementById('canvas');
    const ctx = canvasEl.getContext('2d');
    const statusEl = document.getElementById('status');

    // START KAMERA
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user', width: 640, height: 480 } 
        });
        videoEl.srcObject = stream;
        await videoEl.play();
      } catch (err) {
        statusEl.textContent = '⚠️ error: ' + err.message;
      }
    }
    startCamera();

    function resizeCanvas() {
      canvasEl.width = window.innerWidth;
      canvasEl.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ---------- STATE ----------
    let gestureMode = 'open';
    let frameCount = 0;
    let zoomLevel = 1.0;
    let animVisible = true;
    let prevPinchDist = 0;
    let isPinching = false;
    let currentRotation = 0;

    // ----- HITUNG JUMLAH JARI TERANGKAT -----
    function countFingers(landmarks) {
      let count = 0;
      if (landmarks[4].x < landmarks[3].x) count++;
      if (landmarks[8].y < landmarks[6].y) count++;
      if (landmarks[12].y < landmarks[10].y) count++;
      if (landmarks[16].y < landmarks[14].y) count++;
      if (landmarks[20].y < landmarks[18].y) count++;
      return count;
    }

    // ----- CEK KEPALAN -----
    function isFist(landmarks) {
      const tips = [8, 12, 16, 20];
      const pips = [6, 10, 14, 18];
      let curled = 0;
      for (let i = 0; i < tips.length; i++) {
        if (landmarks[tips[i]].y > landmarks[pips[i]].y) curled++;
      }
      return curled >= 3;
    }

    // ----- CEK PINCH (semua jari kumpul lalu melebar) -----
    function detectPinch(landmarks) {
      if (!landmarks) return { isPinching: false, dist: 0 };
      
      const wrist = landmarks[0];
      const fingers = [4, 8, 12, 16, 20];
      let avgDist = 0;
      for (let i = 0; i < fingers.length; i++) {
        const dx = landmarks[fingers[i]].x - wrist.x;
        const dy = landmarks[fingers[i]].y - wrist.y;
        avgDist += Math.sqrt(dx*dx + dy*dy);
      }
      avgDist /= fingers.length;
      
      const isPinch = avgDist < 0.12;
      return { isPinching: isPinch, dist: avgDist };
    }

    // ----- ANALISIS GESTUR TANGAN KANAN -----
    function analyzeRightHand(landmarks) {
      if (!landmarks || landmarks.length === 0) return { mode: 'none', fingerCount: 0, rot: 0 };

      const fingerCount = countFingers(landmarks);
      const wrist = landmarks[0];
      const midTip = landmarks[12];
      const dx = midTip.x - wrist.x;
      const dy = midTip.y - wrist.y;
      let rot = Math.atan2(dy, dx);
      const fist = isFist(landmarks);

      let mode = 'open';
      if (fist) {
        mode = 'fist';
      } else if (fingerCount === 1) {
        mode = 'one';
      } else if (fingerCount === 2) {
        mode = 'two';
      } else if (fingerCount === 3) {
        mode = 'three';
      } else {
        mode = 'open';
      }

      return { mode, fingerCount, rot, isFist: fist };
    }

    // ----- DRAW GAMBAR DI POJOK KANAN ATAS + ROTATE -----
    function drawShape(gesture, rot, zoom) {
      if (gesture === 'fist') {
        animVisible = false;
        return;
      }
      animVisible = true;

      // POSISI TETAP DI POJOK KANAN ATAS
      const w = canvasEl.width;
      const h = canvasEl.height;
      const cx = w * 0.78;
      const cy = h * 0.22;

      let size = 180 * zoom;
      if (gesture === 'open') size = 220 * zoom;
      else if (gesture === 'one') size = 160 * zoom;
      else if (gesture === 'two') size = 190 * zoom;
      else if (gesture === 'three') size = 200 * zoom;

      // ROTASI dari tangan
      const angle = rot + Math.PI/2;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);

      // GLOW
      const grad = ctx.createRadialGradient(0, 0, 5, 0, 0, size * 1.8);
      grad.addColorStop(0, 'rgba(255,200,230,0.15)');
      grad.addColorStop(0.5, 'rgba(200,150,255,0.05)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, size * 1.8, 0, Math.PI * 2);
      ctx.fill();

      const s = size * 0.5;
      ctx.shadowBlur = 40;
      ctx.shadowColor = 'rgba(255,200,230,0.3)';
      ctx.lineWidth = 2.5;

      // --- GAMBAR BERBEDA SETIAP GESTURE ---
      if (gesture === 'open') {
        // BUNGA MAWAR / ROSE
        const petals = 12;
        ctx.strokeStyle = '#ff6b8a';
        ctx.fillStyle = 'rgba(255,107,138,0.15)';
        ctx.beginPath();
        for (let i = 0; i < petals * 2; i++) {
          const r = i % 2 === 0 ? s : s * 0.3;
          const ang = (i / (petals * 2)) * Math.PI * 2 + frameCount * 0.003;
          const px = Math.cos(ang) * r;
          const py = Math.sin(ang) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Lapisan kedua
        ctx.strokeStyle = '#ff4080';
        ctx.fillStyle = 'rgba(255,64,128,0.1)';
        ctx.lineWidth = 1.5;
        const s2 = s * 0.6;
        ctx.beginPath();
        for (let i = 0; i < 8 * 2; i++) {
          const r = i % 2 === 0 ? s2 : s2 * 0.2;
          const ang = (i / (8 * 2)) * Math.PI * 2 - frameCount * 0.002;
          const px = Math.cos(ang) * r;
          const py = Math.sin(ang) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Pusat bunga
        ctx.shadowBlur = 60;
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.15, 0, Math.PI * 2);
        ctx.fill();

      } else if (gesture === 'one') {
        // KUPU-KUPU / BUTTERFLY
        ctx.strokeStyle = '#ff8c00';
        ctx.fillStyle = 'rgba(255,140,0,0.12)';
        ctx.lineWidth = 2;
        
        // Sayap kiri
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-s * 0.8, -s * 0.7, -s * 0.5, -s * 0.1);
        ctx.quadraticCurveTo(-s * 0.9, s * 0.1, -s * 0.3, s * 0.3);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Sayap kanan
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(s * 0.8, -s * 0.7, s * 0.5, -s * 0.1);
        ctx.quadraticCurveTo(s * 0.9, s * 0.1, s * 0.3, s * 0.3);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Sayap bawah
        ctx.fillStyle = 'rgba(255,140,0,0.08)';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-s * 0.4, s * 0.4, -s * 0.2, s * 0.7);
        ctx.quadraticCurveTo(0, s * 0.8, s * 0.2, s * 0.7);
        ctx.quadraticCurveTo(s * 0.4, s * 0.4, 0, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Body
        ctx.shadowBlur = 20;
        ctx.fillStyle = '#ff6b00';
        ctx.beginPath();
        ctx.ellipse(0, 0, 4, s * 0.25, 0, 0, Math.PI * 2);
        ctx.fill();

        // Antena
        ctx.strokeStyle = '#ff8c00';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-3, -s * 0.15);
        ctx.quadraticCurveTo(-s * 0.15, -s * 0.4, -s * 0.1, -s * 0.5);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(3, -s * 0.15);
        ctx.quadraticCurveTo(s * 0.15, -s * 0.4, s * 0.1, -s * 0.5);
        ctx.stroke();

      } else if (gesture === 'two') {
        // GALAKSI / SPIRAL
        ctx.strokeStyle = '#9b59b6';
        ctx.fillStyle = 'rgba(155,89,182,0.08)';
        ctx.lineWidth = 2;
        
        // Spiral
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          for (let t = 0; t < 1; t += 0.01) {
            const ang = t * Math.PI * 6 + i * 1.5 + frameCount * 0.005;
            const rad = s * t * 0.8;
            const px = Math.cos(ang) * rad;
            const py = Math.sin(ang) * rad;
            if (t === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();
        }

        // Bintang-bintang
        ctx.shadowBlur = 30;
        for (let i = 0; i < 20; i++) {
          const ang = Math.random() * Math.PI * 2;
          const rad = Math.random() * s * 0.8;
          const px = Math.cos(ang) * rad;
          const py = Math.sin(ang) * rad;
          const size = 2 + Math.random() * 4;
          ctx.fillStyle = `hsl(${280 + Math.random() * 40}, 100%, ${70 + Math.random() * 30}%)`;
          ctx.beginPath();
          for (let j = 0; j < 4 * 2; j++) {
            const r = j % 2 === 0 ? size : size * 0.3;
            const a = (j / (4 * 2)) * Math.PI * 2 + Math.random();
            if (j === 0) ctx.moveTo(px + Math.cos(a) * r, py + Math.sin(a) * r);
            else ctx.lineTo(px + Math.cos(a) * r, py + Math.sin(a) * r);
          }
          ctx.closePath();
          ctx.fill();
        }

        // Pusat galaksi
        ctx.shadowBlur = 80;
        ctx.fillStyle = '#e8d5f5';
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.12, 0, Math.PI * 2);
        ctx.fill();

      } else if (gesture === 'three') {
        // KRISTAL / DIAMOND
        ctx.strokeStyle = '#00bcd4';
        ctx.fillStyle = 'rgba(0,188,212,0.1)';
        ctx.lineWidth = 2.5;
        
        // Kristal utama
        const points = 6;
        ctx.beginPath();
        for (let i = 0; i < points * 2; i++) {
          const r = i % 2 === 0 ? s : s * 0.4;
          const ang = (i / (points * 2)) * Math.PI * 2 + frameCount * 0.002;
          const px = Math.cos(ang) * r;
          const py = Math.sin(ang) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Kristal dalam
        ctx.strokeStyle = '#4dd0e1';
        ctx.fillStyle = 'rgba(77,208,225,0.06)';
        ctx.lineWidth = 1.5;
        const s2 = s * 0.6;
        ctx.beginPath();
        for (let i = 0; i < 8 * 2; i++) {
          const r = i % 2 === 0 ? s2 : s2 * 0.3;
          const ang = (i / (8 * 2)) * Math.PI * 2 - frameCount * 0.003;
          const px = Math.cos(ang) * r;
          const py = Math.sin(ang) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Sinar
        ctx.shadowBlur = 30;
        for (let i = 0; i < 6; i++) {
          const ang = (i / 6) * Math.PI * 2 + frameCount * 0.01;
          ctx.strokeStyle = `rgba(0,188,212,${0.15 + Math.sin(frameCount * 0.02 + i) * 0.05})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(Math.cos(ang) * s * 0.2, Math.sin(ang) * s * 0.2);
          ctx.lineTo(Math.cos(ang) * s * 0.9, Math.sin(ang) * s * 0.9);
          ctx.stroke();
        }

        // Pusat
        ctx.shadowBlur = 60;
        ctx.fillStyle = '#e0f7fa';
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.1, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // ----- MEDIAPIPE RESULTS -----
    function onResults(results) {
      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

      let rightHand = null;
      let leftHand = null;

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        for (let i = 0; i < results.multiHandLandmarks.length && i < 2; i++) {
          const lm = results.multiHandLandmarks[i];
          if (i === 0) rightHand = lm;
          else if (i === 1) leftHand = lm;
        }
      }

      // Proses tangan kanan
      if (rightHand) {
        const gesture = analyzeRightHand(rightHand);
        gestureMode = gesture.mode;
        currentRotation = gesture.rot || 0;

        // Proses tangan kiri untuk ZOOM (pinch)
        let zoom = zoomLevel;
        if (leftHand) {
          const pinchData = detectPinch(leftHand);
          
          if (pinchData.isPinching) {
            if (!isPinching) {
              isPinching = true;
              prevPinchDist = pinchData.dist;
            } else {
              const delta = pinchData.dist - prevPinchDist;
              zoom = Math.max(0.3, Math.min(3.0, zoomLevel + delta * 15));
              zoomLevel = zoom;
              prevPinchDist = pinchData.dist;
            }
          } else {
            isPinching = false;
            prevPinchDist = 0;
          }
        }

        // STATUS & DRAW
        let statusText = '';
        if (gesture.mode === 'fist') {
          statusText = '✊ kepalan · HILANG';
          animVisible = false;
        } else {
          animVisible = true;
          if (gesture.mode === 'one') statusText = '☝️ 1 jari · KUPU-KUPU';
          else if (gesture.mode === 'two') statusText = '✌️ 2 jari · GALAKSI';
          else if (gesture.mode === 'three') statusText = '🖖 3 jari · KRISTAL';
          else statusText = '🖐️ terbuka · BUNGA MAWAR';
          if (leftHand) {
            if (isPinching) statusText += ' | zoom: ' + zoom.toFixed(2);
            else statusText += ' | pinch untuk zoom';
          }
          statusText += ' | putar tangan ↻';
          
          drawShape(gesture.mode, gesture.rot || 0, zoom);
        }
        statusEl.textContent = statusText;

      } else {
        statusEl.textContent = '✧ tunjukkan tangan kananmu ✧';
        // Tampilkan animasi default di pojok jika tidak ada tangan
        if (animVisible) {
          drawShape('open', 0, zoomLevel);
        }
      }

      frameCount++;
    }

    // ----- MEDIAPIPE INIT -----
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.6
    });
    hands.onResults(onResults);

    // LOOP DETECTION
    async function detectLoop() {
      try {
        if (videoEl.readyState >= 2) {
          await hands.send({ image: videoEl });
        }
      } catch (e) {}
      requestAnimationFrame(detectLoop);
    }

    setTimeout(() => detectLoop(), 1000);
  })();
</script>
</body>
</html>
