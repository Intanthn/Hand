<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Tangan · Animasi 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0b0b1a; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
    #wrap {
      position: relative;
      width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #141428 0%, #070712 100%);
    }
    video { display: none; }
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform: scaleX(-1); /* mirror effect */
    }
    #status {
      position: absolute;
      top: 16px; left: 16px;
      color: #b7c9ff;
      font-size: 14px;
      background: rgba(10, 10, 30, 0.7);
      backdrop-filter: blur(4px);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
      pointer-events: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      letter-spacing: 0.3px;
    }
    #hint {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: rgba(200, 215, 255, 0.5);
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(0,20,80,0.5);
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="status">👋 gerakkan tangan</div>
  <div id="hint">buka tangan · kepal · 2 jari · putar</div>
</div>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
  (function() {
    const videoEl = document.getElementById('video');
    const canvasEl = document.getElementById('canvas');
    const ctx = canvasEl.getContext('2d');
    const statusEl = document.getElementById('status');

    // --- ukuran canvas ---
    function resizeCanvas() {
      canvasEl.width = window.innerWidth;
      canvasEl.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ---------- particle system yang lebih "cantik" ----------
    class Particle3D {
      constructor(x, y, baseHue) {
        this.x = x;
        this.y = y;
        // gerakan lembut naik + spiral
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.6 + Math.random() * 1.8;
        this.vx = Math.cos(angle) * speed * 0.6;
        this.vy = Math.sin(angle) * speed * 0.6 - 0.3;
        this.life = 0.9 + Math.random() * 0.4;
        this.decay = 0.006 + Math.random() * 0.015;
        this.size = 3 + Math.random() * 8;
        this.hue = baseHue + (Math.random() - 0.5) * 30;
        this.sat = 80 + Math.random() * 20;
        this.light = 60 + Math.random() * 30;
        this.glow = 0.3 + Math.random() * 0.4;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy -= 0.02;  // sedikit mengambang
        this.vx *= 0.99;
        this.vy *= 0.99;
        this.life -= this.decay;
        this.size *= 0.998;
      }
      draw(ctx) {
        const a = Math.max(this.life, 0) * this.glow;
        ctx.globalAlpha = a;
        ctx.shadowColor = `hsl(${this.hue}, 100%, 70%)`;
        ctx.shadowBlur = 18;
        ctx.fillStyle = `hsl(${this.hue}, ${this.sat}%, ${this.light}%)`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(this.size, 0.3), 0, Math.PI * 2);
        ctx.fill();
        // core lebih terang
        ctx.shadowBlur = 30;
        ctx.fillStyle = `hsla(${this.hue}, 100%, 85%, ${a*0.5})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(this.size * 0.3, 0.5), 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    // ---------- state & partikel ----------
    let particles = [];
    let handPos = { x: window.innerWidth/2, y: window.innerHeight/2 };
    let handClosed = false;          // kepalan
    let twoFingersDown = false;      // 2 jari turun (telunjuk + tengah)
    let handRotation = 0;            // estimasi rotasi tangan (dari sudut)
    let gestureMode = 'open';        // 'open', 'fist', 'two', 'rotate'
    let lastGesture = 'open';
    let frameCount = 0;

    // warna tema
    let currentHue = 210; // biru awal

    // ----- deteksi gestur (lebih halus) -----
    function analyzeGesture(landmarks) {
      if (!landmarks || landmarks.length === 0) return { mode: 'none', closed: false, two: false, rot: 0 };

      const tips = [8, 12, 16, 20];
      const pips = [6, 10, 14, 18];
      let curled = 0;
      for (let i = 0; i < tips.length; i++) {
        if (landmarks[tips[i]].y > landmarks[pips[i]].y) curled++;
      }
      // deteksi jari telunjuk (8) dan jari tengah (12) turun
      const indexDown = landmarks[8].y > landmarks[6].y;
      const middleDown = landmarks[12].y > landmarks[10].y;
      const twoDown = indexDown && middleDown;

      // estimasi rotasi berdasarkan sudut pergelangan ke ujung jari tengah
      const wrist = landmarks[0];
      const midTip = landmarks[12];
      const dx = midTip.x - wrist.x;
      const dy = midTip.y - wrist.y;
      let rot = Math.atan2(dy, dx); // -PI .. PI

      return {
        closed: curled >= 3,
        two: twoDown,
        rot: rot,
        mode: curled >= 3 ? 'fist' : (twoDown ? 'two' : 'open')
      };
    }

    // ----- gambar elemen 3D di canvas (tanpa gambar tangan) -----
    function draw3DScene(gesture, rot) {
      const w = canvasEl.width;
      const h = canvasEl.height;
      const cx = handPos.x;
      const cy = handPos.y;

      // base size
      let baseSize = 90 + Math.sin(frameCount * 0.01) * 4;
      if (gesture === 'fist') baseSize = 70;
      else if (gesture === 'two') baseSize = 110;
      else baseSize = 130;

      // rotasi visual
      const angle = rot + Math.PI/2; // offset

      // ---- CUBE / SHAPE ELEGAN ----
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);

      // warna berdasarkan gesture
      let hue = 210; // default biru
      if (gesture === 'fist') hue = 280; // ungu
      else if (gesture === 'two') hue = 340; // merah muda
      else if (gesture === 'open') hue = 190 + Math.sin(frameCount*0.02)*15; // cyan

      currentHue = hue;

      // efek glow di belakang
      const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, baseSize * 1.5);
      grad.addColorStop(0, `hsla(${hue}, 90%, 70%, 0.25)`);
      grad.addColorStop(0.6, `hsla(${hue+30}, 80%, 50%, 0.08)`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, baseSize * 1.5, 0, Math.PI*2);
      ctx.fill();

      // --- MAIN SHAPE: octahedron / diamond 3D illusion ---
      const s = baseSize * 0.6;
      const pts = [
        [0, -s*1.2], [s*0.8, -s*0.3], [s*0.5, s*0.5],
        [-s*0.5, s*0.5], [-s*0.8, -s*0.3]
      ];
      // shape berlapis
      for (let layer = 0; layer < 3; layer++) {
        const scale = 1 - layer * 0.15;
        const alpha = 0.3 + layer * 0.2;
        ctx.globalAlpha = alpha;
        ctx.shadowColor = `hsl(${hue+20}, 100%, 70%)`;
        ctx.shadowBlur = 30 - layer * 6;
        ctx.strokeStyle = `hsl(${hue+layer*20}, 90%, 70%)`;
        ctx.lineWidth = 2.2 - layer * 0.4;
        ctx.beginPath();
        const ptsScaled = pts.map(p => [p[0]*scale, p[1]*scale]);
        ptsScaled.forEach((p, i) => {
          if (i===0) ctx.moveTo(p[0], p[1]);
          else ctx.lineTo(p[0], p[1]);
        });
        ctx.closePath();
        ctx.stroke();

        // isi transparan
        ctx.fillStyle = `hsla(${hue+layer*15}, 80%, 65%, ${0.08+layer*0.03})`;
        ctx.fill();
      }

      // garis-garis halus di dalam
      for (let i=0; i<8; i++) {
        const ang = i / 8 * Math.PI*2 + frameCount*0.005;
        const r1 = baseSize * 0.2;
        const r2 = baseSize * 0.7;
        ctx.globalAlpha = 0.2 + 0.1 * Math.sin(frameCount*0.02 + i);
        ctx.strokeStyle = `hsl(${hue+30}, 80%, 75%)`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(ang)*r1, Math.sin(ang)*r1);
        ctx.lineTo(Math.cos(ang+0.5)*r2, Math.sin(ang+0.5)*r2);
        ctx.stroke();
      }

      // titik pusat bercahaya
      ctx.globalAlpha = 0.8;
      ctx.shadowBlur = 50;
      ctx.shadowColor = `hsl(${hue}, 100%, 80%)`;
      ctx.fillStyle = `hsl(${hue}, 100%, 85%)`;
      ctx.beginPath();
      ctx.arc(0, 0, 8 + Math.sin(frameCount*0.04)*2, 0, Math.PI*2);
      ctx.fill();

      ctx.restore();

      // --- partikel tambahan dari shape ---
      if (frameCount % 2 === 0) {
        const count = gesture === 'fist' ? 2 : (gesture === 'two' ? 3 : 4);
        for (let i=0; i<count; i++) {
          const ang2 = Math.random() * Math.PI*2;
          const dist = baseSize * 0.5 * (0.6 + Math.random()*0.5);
          const px = cx + Math.cos(ang2 + angle) * dist;
          const py = cy + Math.sin(ang2 + angle) * dist;
          const p = new Particle3D(px, py, hue + (Math.random()-0.5)*40);
          particles.push(p);
        }
      }
    }

    // ----- MediaPipe hasil -----
    function onResults(results) {
      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

      // deteksi tangan
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        const wrist = lm[0];
        const x = wrist.x * canvasEl.width;
        const y = wrist.y * canvasEl.height;
        handPos.x = x;
        handPos.y = y;

        const gesture = analyzeGesture(lm);
        handClosed = gesture.closed;
        twoFingersDown = gesture.two;
        handRotation = gesture.rot;

        // mode
        let mode = 'open';
        if (gesture.closed) mode = 'fist';
        else if (gesture.two) mode = 'two';
        else mode = 'open';
        gestureMode = mode;

        // status
        let statusText = '';
        if (mode === 'fist') statusText = '✊ kepalan · ungu';
        else if (mode === 'two') statusText = '✌️ 2 jari · pink';
        else if (mode === 'open') statusText = '🖐️ terbuka · biru';
        statusEl.textContent = statusText + '  |  putar tangan ↻';

        // gambar scene 3D tanpa gambar tangan
        draw3DScene(mode, handRotation);

      } else {
        // tidak ada tangan: tampilkan pesan & partikel latar
        statusEl.textContent = '👋 tunjukkan tangan';
        // partikel ambient
        if (frameCount % 3 === 0) {
          const x = Math.random() * canvasEl.width;
          const y = Math.random() * canvasEl.height;
          const p = new Particle3D(x, y, 200 + Math.random()*40);
          p.life = 0.5;
          p.size = 2;
          particles.push(p);
        }
        // tetap gambar efek ringan
        ctx.save();
        ctx.globalAlpha = 0.15;
        ctx.fillStyle = '#6a7aff';
        ctx.shadowBlur = 40;
        ctx.shadowColor = '#4a6aff';
        ctx.beginPath();
        ctx.arc(handPos.x, handPos.y, 60 + Math.sin(frameCount*0.02)*10, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }

      // update partikel
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => { p.update(); p.draw(ctx); });
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

      frameCount++;
    }

    // ----- inisialisasi MediaPipe -----
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.6
    });
    hands.onResults(onResults);

    const camera = new Camera(videoEl, {
      onFrame: async () => {
        try {
          await hands.send({ image: videoEl });
        } catch (e) {
          // silent
        }
      },
      width: 640,
      height: 480
    });
    camera.start().catch(err => {
      statusEl.textContent = '⚠️ kamera error: ' + err.message;
    });

    // handle resize untuk posisi tangan
    window.addEventListener('resize', () => {
      resizeCanvas();
    });

    // fallback partikel awal
    for (let i=0; i<30; i++) {
      const p = new Particle3D(
        Math.random() * window.innerWidth,
        Math.random() * window.innerHeight,
        200 + Math.random()*60
      );
      p.life = 0.3 + Math.random()*0.3;
      p.size = 2 + Math.random()*4;
      particles.push(p);
    }
  })();
</script>
</body>
</html>
