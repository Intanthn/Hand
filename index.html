<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Aesthetic · Hand Magic</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #0a0a12; 
      overflow: hidden; 
      font-family: 'Georgia', 'Times New Roman', serif;
    }
    #wrap {
      position: relative;
      width: 100vw; height: 100vh;
      background: #0a0a12;
    }
    video { 
      display: block;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform: scaleX(-1);
      object-fit: cover;
      z-index: 1;
    }
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform: scaleX(-1);
      z-index: 2;
      pointer-events: none;
    }
    #status {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 215, 215, 0.8);
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: rgba(10, 10, 20, 0.6);
      backdrop-filter: blur(10px);
      padding: 8px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255, 200, 200, 0.15);
      z-index: 10;
      font-family: 'Georgia', serif;
      pointer-events: none;
    }
    #aesthetic-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 220, 220, 0.12);
      font-size: clamp(40px, 12vw, 120px);
      font-weight: 300;
      letter-spacing: 8px;
      text-align: center;
      z-index: 5;
      pointer-events: none;
      font-family: 'Georgia', serif;
      text-shadow: 0 0 60px rgba(255, 150, 200, 0.05);
      line-height: 1.2;
      white-space: nowrap;
    }
    #aesthetic-sub {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 200, 200, 0.06);
      font-size: clamp(14px, 2vw, 30px);
      letter-spacing: 12px;
      text-align: center;
      z-index: 5;
      pointer-events: none;
      font-family: 'Georgia', serif;
      font-style: italic;
    }
    #like-counter {
      position: absolute;
      bottom: 80px;
      right: 30px;
      color: rgba(255, 200, 200, 0.2);
      font-size: 14px;
      letter-spacing: 2px;
      z-index: 5;
      pointer-events: none;
      font-family: 'Georgia', serif;
    }
    #like-counter span {
      font-size: 20px;
      margin-right: 6px;
    }
    #frame-info {
      position: absolute;
      top: 30px;
      right: 30px;
      color: rgba(255, 200, 200, 0.12);
      font-size: 11px;
      letter-spacing: 1px;
      z-index: 5;
      pointer-events: none;
      font-family: 'Courier New', monospace;
      text-align: right;
      line-height: 1.8;
    }
  </style>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  
  <!-- ELEMEN AESTHETIC -->
  <div id="aesthetic-text">✦ ETERNAL ✦</div>
  <div id="aesthetic-sub">— between stars —</div>
  <div id="like-counter"><span>✦</span> 222.419</div>
  <div id="frame-info">
    Project1<br>
    (128,128) (139,786)<br>
    00:00:06:18
  </div>
  <div id="status">✧ gerakkan tanganmu ✧</div>
</div>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
  (function() {
    const videoEl = document.getElementById('video');
    const canvasEl = document.getElementById('canvas');
    const ctx = canvasEl.getContext('2d');
    const statusEl = document.getElementById('status');

    // MULAI KAMERA LANGSUNG
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user', width: 640, height: 480 } 
        });
        videoEl.srcObject = stream;
        await videoEl.play();
      } catch (err) {
        statusEl.textContent = '⚠️ error kamera: ' + err.message;
      }
    }
    startCamera();

    function resizeCanvas() {
      canvasEl.width = window.innerWidth;
      canvasEl.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ---------- PARTICLE SYSTEM AESTHETIC ----------
    class AestheticParticle {
      constructor(x, y, baseHue) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.3 + Math.random() * 1.2;
        this.vx = Math.cos(angle) * speed * 0.4;
        this.vy = Math.sin(angle) * speed * 0.4 - 0.15;
        this.life = 0.7 + Math.random() * 0.5;
        this.decay = 0.003 + Math.random() * 0.01;
        this.size = 1 + Math.random() * 4;
        this.hue = baseHue + (Math.random() - 0.5) * 40;
        this.sat = 70 + Math.random() * 30;
        this.light = 60 + Math.random() * 30;
        this.phase = Math.random() * Math.PI * 2;
        this.type = Math.random() > 0.6 ? 'star' : 'circle';
      }
      update(frame) {
        this.x += this.vx + Math.sin(frame * 0.015 + this.phase) * 0.1;
        this.y += this.vy + Math.cos(frame * 0.02 + this.phase) * 0.08;
        this.vy -= 0.01;
        this.vx *= 0.998;
        this.vy *= 0.998;
        this.life -= this.decay;
        this.size *= 0.999;
      }
      draw(ctx) {
        const a = Math.max(this.life, 0) * 0.7;
        ctx.globalAlpha = a;
        ctx.shadowColor = `hsl(${this.hue}, 100%, 70%)`;
        ctx.shadowBlur = 25;
        ctx.fillStyle = `hsl(${this.hue}, ${this.sat}%, ${this.light}%)`;
        
        if (this.type === 'star') {
          const spikes = 4;
          const rad = Math.max(this.size * 1.5, 1);
          ctx.beginPath();
          for (let i = 0; i < spikes * 2; i++) {
            const r = i % 2 === 0 ? rad : rad * 0.4;
            const angle = (i / (spikes * 2)) * Math.PI * 2 + this.phase;
            if (i === 0) ctx.moveTo(this.x + Math.cos(angle) * r, this.y + Math.sin(angle) * r);
            else ctx.lineTo(this.x + Math.cos(angle) * r, this.y + Math.sin(angle) * r);
          }
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(this.x, this.y, Math.max(this.size, 0.5), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.shadowBlur = 0;
      }
    }

    // ---------- STATE ----------
    let particles = [];
    let handPos = { x: window.innerWidth/2, y: window.innerHeight/2 };
    let gestureMode = 'open';
    let frameCount = 0;
    let currentHue = 320;
    let lastParticleTime = 0;

    // ----- ANALISIS GESTUR -----
    function analyzeGesture(landmarks) {
      if (!landmarks || landmarks.length === 0) return { mode: 'none' };

      const tips = [8, 12, 16, 20];
      const pips = [6, 10, 14, 18];
      let curled = 0;
      for (let i = 0; i < tips.length; i++) {
        if (landmarks[tips[i]].y > landmarks[pips[i]].y) curled++;
      }
      const indexDown = landmarks[8].y > landmarks[6].y;
      const middleDown = landmarks[12].y > landmarks[10].y;
      const twoDown = indexDown && middleDown;

      const wrist = landmarks[0];
      const midTip = landmarks[12];
      const dx = midTip.x - wrist.x;
      const dy = midTip.y - wrist.y;
      let rot = Math.atan2(dy, dx);

      return {
        mode: curled >= 3 ? 'fist' : (twoDown ? 'two' : 'open'),
        rot: rot,
        closed: curled >= 3,
        two: twoDown
      };
    }

    // ----- DRAW AESTHETIC SCENE -----
    function drawAestheticScene(gesture, rot) {
      const w = canvasEl.width;
      const h = canvasEl.height;
      const cx = handPos.x;
      const cy = handPos.y;

      let baseSize = 80 + Math.sin(frameCount * 0.02) * 5;
      if (gesture === 'fist') baseSize = 60;
      else if (gesture === 'two') baseSize = 100;
      else baseSize = 120;

      const angle = rot + Math.PI/2;

      let hue = 330;
      if (gesture === 'fist') hue = 280;
      else if (gesture === 'two') hue = 350;
      else hue = 320 + Math.sin(frameCount * 0.015) * 20;
      currentHue = hue;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);

      // GLOW BACKGROUND
      const grad = ctx.createRadialGradient(0, 0, 5, 0, 0, baseSize * 2);
      grad.addColorStop(0, `hsla(${hue}, 90%, 75%, 0.15)`);
      grad.addColorStop(0.4, `hsla(${hue+30}, 80%, 60%, 0.07)`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, baseSize * 2, 0, Math.PI * 2);
      ctx.fill();

      // MAIN SHAPE
      const layers = gesture === 'fist' ? 4 : (gesture === 'two' ? 6 : 5);
      const s = baseSize * 0.5;

      for (let layer = 0; layer < layers; layer++) {
        const scale = 1 - layer * 0.1;
        const alpha = 0.2 + layer * 0.1;
        ctx.globalAlpha = alpha;
        const layerHue = hue + layer * 12 + (gesture === 'fist' ? 15 : 0);
        
        ctx.shadowColor = `hsl(${layerHue+20}, 100%, 70%)`;
        ctx.shadowBlur = 30 - layer * 2;
        ctx.strokeStyle = `hsl(${layerHue}, 85%, ${65 + layer * 4}%)`;
        ctx.lineWidth = 1.5 - layer * 0.1;

        const petals = gesture === 'fist' ? 6 : (gesture === 'two' ? 8 : 7);
        ctx.beginPath();
        for (let i = 0; i < petals * 2; i++) {
          const r = i % 2 === 0 ? s * scale : s * scale * 0.35;
          const ang = (i / (petals * 2)) * Math.PI * 2 + frameCount * 0.002 + layer * 0.15;
          const px = Math.cos(ang) * r;
          const py = Math.sin(ang) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();

        ctx.fillStyle = `hsla(${layerHue}, 80%, 70%, ${0.03 + layer * 0.015})`;
        ctx.fill();
      }

      // SPIRAL
      for (let i = 0; i < 25; i++) {
        const t = i / 25;
        const ang = t * Math.PI * 3 + frameCount * 0.008;
        const rad = s * 0.15 + t * s * 0.75;
        const px = Math.cos(ang) * rad;
        const py = Math.sin(ang) * rad;
        ctx.globalAlpha = 0.12 + 0.08 * Math.sin(t * 8 + frameCount * 0.02);
        ctx.fillStyle = `hsl(${hue + 20 + i * 4}, 90%, 80%)`;
        ctx.shadowBlur = 20;
        ctx.shadowColor = `hsl(${hue+30}, 100%, 70%)`;
        ctx.beginPath();
        ctx.arc(px, py, 1.5 + t * 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // CENTER GLOW
      ctx.globalAlpha = 0.8;
      ctx.shadowBlur = 70;
      ctx.shadowColor = `hsl(${hue}, 100%, 80%)`;
      ctx.fillStyle = `hsl(${hue}, 100%, 92%)`;
      ctx.beginPath();
      ctx.arc(0, 0, 8 + Math.sin(frameCount * 0.04) * 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.restore();

      // SPAWN PARTICLES
      const now = Date.now();
      if (now - lastParticleTime > 20) {
        const count = gesture === 'fist' ? 2 : (gesture === 'two' ? 3 : 4);
        for (let i = 0; i < count; i++) {
          const ang2 = Math.random() * Math.PI * 2;
          const dist = baseSize * 0.3 * (0.4 + Math.random() * 0.6);
          const px = cx + Math.cos(ang2 + angle) * dist;
          const py = cy + Math.sin(ang2 + angle) * dist;
          const p = new AestheticParticle(px, py, hue + (Math.random() - 0.5) * 50);
          particles.push(p);
        }
        lastParticleTime = now;
      }
    }

    // ----- LOOP DETECTION -----
    async function detectLoop() {
      try {
        if (videoEl.readyState >= 2) {
          // Kirim frame ke MediaPipe
          await hands.send({ image: videoEl });
        }
      } catch (e) {
        // silent
      }
      requestAnimationFrame(detectLoop);
    }

    // ----- MEDIAPIPE RESULTS -----
    function onResults(results) {
      // Kosongkan canvas
      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

      // Deteksi tangan
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        const wrist = lm[0];
        const x = wrist.x * canvasEl.width;
        const y = wrist.y * canvasEl.height;
        handPos.x = x;
        handPos.y = y;

        const gesture = analyzeGesture(lm);
        gestureMode = gesture.mode;

        let statusText = '';
        if (gestureMode === 'fist') statusText = '✧ kepalan · violet ✧';
        else if (gestureMode === 'two') statusText = '✧ 2 jari · rose ✧';
        else if (gestureMode === 'open') statusText = '✧ terbuka · pearl ✧';
        statusEl.textContent = statusText + '  |  putar tangan';

        drawAestheticScene(gestureMode, gesture.rot || 0);
      } else {
        statusEl.textContent = '✧ tunjukkan tanganmu ✧';
        // ambient particles
        if (frameCount % 3 === 0) {
          const x = Math.random() * canvasEl.width;
          const y = Math.random() * canvasEl.height;
          const p = new AestheticParticle(x, y, 320 + Math.random()*40);
          p.life = 0.4;
          p.size = 1.5;
          particles.push(p);
        }
      }

      // Update & draw particles
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => { p.update(frameCount); p.draw(ctx); });
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

      frameCount++;
    }

    // ----- INIT MEDIAPIPE -----
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.6
    });
    hands.onResults(onResults);

    // Start detection loop
    setTimeout(() => {
      detectLoop();
    }, 1000);

    // INIT PARTICLES
    for (let i = 0; i < 50; i++) {
      const p = new AestheticParticle(
        Math.random() * window.innerWidth,
        Math.random() * window.innerHeight,
        320 + Math.random()*50
      );
      p.life = 0.2 + Math.random() * 0.3;
      p.size = 1 + Math.random() * 2.5;
      particles.push(p);
    }
  })();
</script>
</body>
</html>
