<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Puzzle · Frame Capture</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a12; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    #wrap {
      position: relative;
      width: 100vw; height: 100vh;
      background: #0a0a12;
      overflow: hidden;
    }
    video {
      display: block;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform: scaleX(-1);
      object-fit: cover;
      z-index: 1;
    }
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform: scaleX(-1);
      z-index: 2;
      pointer-events: none;
    }
    #status {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,215,215,0.9);
      font-size: 14px;
      background: rgba(10,10,20,0.7);
      backdrop-filter: blur(10px);
      padding: 10px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255,200,200,0.1);
      z-index: 10;
      text-align: center;
      pointer-events: none;
      font-weight: 300;
      letter-spacing: 0.5px;
      max-width: 90%;
    }
    #timer-display {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 120px;
      font-weight: 700;
      z-index: 10;
      text-shadow: 0 0 60px rgba(255,200,200,0.5);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      font-variant-numeric: tabular-nums;
    }
    #timer-display.show { opacity: 1; }
    #puzzle-counter {
      position: absolute;
      top: 30px;
      right: 30px;
      color: rgba(255,255,255,0.6);
      font-size: 16px;
      z-index: 10;
      text-align: right;
      pointer-events: none;
      background: rgba(0,0,0,0.4);
      padding: 8px 16px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.05);
    }
    #puzzle-counter span { color: white; font-weight: 700; font-size: 22px; }
    #piece-status {
      position: absolute;
      top: 80px;
      right: 30px;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      z-index: 10;
      text-align: right;
      pointer-events: none;
      background: rgba(0,0,0,0.3);
      padding: 6px 12px;
      border-radius: 8px;
    }
    #complete-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(20px);
      z-index: 20;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 20px;
    }
    #complete-overlay.show { display: flex; }
    #complete-overlay h1 {
      color: white;
      font-size: 32px;
      font-weight: 300;
      letter-spacing: 4px;
    }
    #complete-overlay .strip {
      display: flex;
      gap: 12px;
      padding: 20px;
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      flex-wrap: wrap;
      justify-content: center;
    }
    #complete-overlay .strip img {
      width: 100px;
      height: 130px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.2);
    }
    #complete-overlay button {
      background: #ff2d55;
      color: white;
      border: none;
      padding: 12px 40px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.2s;
      margin-top: 10px;
    }
    #complete-overlay button:hover { transform: scale(1.05); }
    .hint {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.2);
      font-size: 11px;
      letter-spacing: 1px;
      z-index: 5;
      pointer-events: none;
      text-align: center;
    }
  </style>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  
  <div id="timer-display">3</div>
  <div id="puzzle-counter">📸 <span id="puzzle-count">0</span> / 3</div>
  <div id="piece-status">🧩 0 / 4</div>
  <div id="status">✧ pinch 2 jari untuk bikin frame ✧</div>
  <div class="hint">pinch 2 tangan → frame · lepas → capture area dalam frame · susun puzzle</div>
  
  <div id="complete-overlay">
    <h1>✦ STRAP COMPLETE ✦</h1>
    <div class="strip" id="strip-container"></div>
    <button onclick="resetAll()">⟳ ULANGI</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
// ============================================================
// SETUP
// ============================================================
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const timerDisplay = document.getElementById('timer-display');
const puzzleCountEl = document.getElementById('puzzle-count');
const pieceStatusEl = document.getElementById('piece-status');
const completeOverlay = document.getElementById('complete-overlay');
const stripContainer = document.getElementById('strip-container');

let W = 0, H = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ============================================================
// KAMERA
// ============================================================
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: 640, height: 480 }
    });
    video.srcObject = stream;
    await video.play();
  } catch (err) {
    statusEl.textContent = '⚠️ ' + err.message;
  }
}
startCamera();

// ============================================================
// STATE
// ============================================================
let capturedImages = [];
let puzzleCount = 0;
let isCapturing = false;
let frameBox = null;
let dragPiece = null;
let dragOffset = { x: 0, y: 0 };
let currentPieces = [];
let placedCount = 0;
let isFrameReady = false;

// ============================================================
// FUNGSI GESTUR
// ============================================================
function isPinch(lm) {
  if (!lm) return false;
  const thumb = lm[4];
  const index = lm[8];
  const dist = Math.sqrt((thumb.x - index.x) ** 2 + (thumb.y - index.y) ** 2);
  return dist < 0.045;
}

function getHandCenter(lm) {
  let cx = 0, cy = 0;
  for (let i = 0; i < lm.length; i++) {
    cx += lm[i].x;
    cy += lm[i].y;
  }
  return { x: cx / lm.length, y: cy / lm.length };
}

// ============================================================
// DRAW FRAME
// ============================================================
function drawFrameBox(box) {
  if (!box) return;
  const { x, y, w, h } = box;
  ctx.save();
  
  // Darken outside
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, 0, W, y);
  ctx.fillRect(0, y + h, W, H - y - h);
  ctx.fillRect(0, y, x, h);
  ctx.fillRect(x + w, y, W - x - w, h);
  
  // Border
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 3;
  ctx.setLineDash([8, 6]);
  ctx.shadowBlur = 30;
  ctx.shadowColor = 'rgba(255,200,200,0.3)';
  ctx.strokeRect(x, y, w, h);
  ctx.setLineDash([]);
  
  // Corner markers
  const cornerSize = 20;
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  const corners = [
    [x, y, 1, 1], [x+w, y, -1, 1],
    [x, y+h, 1, -1], [x+w, y+h, -1, -1]
  ];
  corners.forEach(([cx, cy, dx, dy]) => {
    ctx.beginPath();
    ctx.moveTo(cx + dx * cornerSize, cy);
    ctx.lineTo(cx, cy);
    ctx.lineTo(cx, cy + dy * cornerSize);
    ctx.stroke();
  });
  
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = '13px sans-serif';
  ctx.fillText('📸 AREA CAPTURE', x + 12, y + 30);
  ctx.restore();
}

// ============================================================
// CAPTURE AREA DALAM FRAME
// ============================================================
function captureFrame() {
  if (isCapturing || puzzleCount >= 3) return;
  if (!frameBox) {
    statusEl.textContent = '✧ bentuk frame dulu dengan 2 jari ✧';
    return;
  }
  
  isCapturing = true;
  let count = 3;
  timerDisplay.textContent = count;
  timerDisplay.classList.add('show');
  statusEl.textContent = `📸 capture dalam ${count}...`;
  
  const interval = setInterval(() => {
    count--;
    if (count <= 0) {
      clearInterval(interval);
      timerDisplay.classList.remove('show');
      doCapture();
    } else {
      timerDisplay.textContent = count;
      statusEl.textContent = `📸 ${count}...`;
    }
  }, 800);
}

function doCapture() {
  // Capture HANYA area dalam frame dari video
  const { x, y, w, h } = frameBox;
  
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = 320;
  tempCanvas.height = 240;
  const tempCtx = tempCanvas.getContext('2d');
  
  // Ambil dari video dengan crop area frame
  // Video di-mirror, jadi kita sesuaikan
  const vw = video.videoWidth || 640;
  const vh = video.videoHeight || 480;
  
  // Hitung proporsi area frame terhadap layar
  const scaleX = vw / W;
  const scaleY = vh / H;
  
  const sx = x * scaleX;
  const sy = y * scaleY;
  const sw = w * scaleX;
  const sh = h * scaleY;
  
  tempCtx.drawImage(video, sx, sy, sw, sh, 0, 0, 320, 240);
  
  const imageData = tempCanvas.toDataURL('image/jpeg');
  capturedImages.push(imageData);
  
  // Buat potongan puzzle (4 potongan)
  const pieces = [];
  const cols = 2, rows = 2;
  const pw = 160, ph = 120;
  const spacing = 20;
  const totalW = cols * pw + (cols - 1) * spacing;
  const totalH = rows * ph + (rows - 1) * spacing;
  const startX = (W - totalW * 0.5) / 2;
  const startY = (H - totalH * 0.5) / 2;
  
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const pieceCanvas = document.createElement('canvas');
      pieceCanvas.width = pw;
      pieceCanvas.height = ph;
      const pCtx = pieceCanvas.getContext('2d');
      pCtx.drawImage(tempCanvas, c * pw, r * ph, pw, ph, 0, 0, pw, ph);
      
      const targetX = startX + c * (pw * 0.5 + spacing * 0.5);
      const targetY = startY + r * (ph * 0.5 + spacing * 0.5);
      
      pieces.push({
        id: pieces.length,
        image: pieceCanvas.toDataURL('image/jpeg'),
        x: 50 + Math.random() * (W - 100),
        y: 50 + Math.random() * (H - 100),
        targetX: targetX,
        targetY: targetY,
        w: pw * 0.5,
        h: ph * 0.5,
        placed: false,
        row: r,
        col: c
      });
    }
  }
  
  currentPieces = pieces;
  placedCount = 0;
  puzzleCount++;
  puzzleCountEl.textContent = puzzleCount;
  updatePieceStatus();
  
  statusEl.textContent = `🧩 Susun potongan ke posisi yang benar (${puzzleCount}/3)`;
  isCapturing = false;
  frameBox = null;
  isFrameReady = false;
  
  if (puzzleCount >= 3) {
    setTimeout(showComplete, 1000);
  }
}

// ============================================================
// DRAG PUZZLE PIECE
// ============================================================
function handleDrag(handPos, isPinching) {
  if (puzzleCount >= 3 || currentPieces.length === 0) return;
  
  if (isPinching && !dragPiece) {
    for (let i = currentPieces.length - 1; i >= 0; i--) {
      const p = currentPieces[i];
      if (p.placed) continue;
      const px = p.x, py = p.y;
      const pw = p.w, ph = p.h;
      if (handPos.x > px - pw/2 && handPos.x < px + pw/2 &&
          handPos.y > py - ph/2 && handPos.y < py + ph/2) {
        dragPiece = p;
        dragOffset.x = handPos.x - px;
        dragOffset.y = handPos.y - py;
        break;
      }
    }
  } else if (!isPinching && dragPiece) {
    const p = dragPiece;
    const dist = Math.sqrt((p.x - p.targetX) ** 2 + (p.y - p.targetY) ** 2);
    if (dist < 40) {
      p.placed = true;
      p.x = p.targetX;
      p.y = p.targetY;
      placedCount++;
      updatePieceStatus();
      statusEl.textContent = `✅ Potongan ditempatkan! (${placedCount}/4)`;
      
      if (placedCount === 4) {
        statusEl.textContent = `🎉 Foto ${puzzleCount} selesai! Buat frame lagi untuk foto berikutnya`;
      }
    }
    dragPiece = null;
  }
  
  if (dragPiece) {
    dragPiece.x = handPos.x - dragOffset.x;
    dragPiece.y = handPos.y - dragOffset.y;
  }
}

function updatePieceStatus() {
  pieceStatusEl.textContent = `🧩 ${placedCount} / ${currentPieces.length}`;
}

// ============================================================
// SHOW COMPLETE
// ============================================================
function showComplete() {
  stripContainer.innerHTML = '';
  capturedImages.forEach(img => {
    const el = document.createElement('img');
    el.src = img;
    stripContainer.appendChild(el);
  });
  completeOverlay.classList.add('show');
  statusEl.textContent = '🎉 Selesai! 3 foto sudah tersusun!';
}

function resetAll() {
  capturedImages = [];
  puzzleCount = 0;
  placedCount = 0;
  currentPieces = [];
  puzzleCountEl.textContent = '0';
  completeOverlay.classList.remove('show');
  frameBox = null;
  dragPiece = null;
  isFrameReady = false;
  updatePieceStatus();
  statusEl.textContent = '✧ pinch 2 jari untuk bikin frame ✧';
}

// ============================================================
// DRAW PUZZLE PIECES
// ============================================================
function drawPieces() {
  currentPieces.forEach(p => {
    const img = new Image();
    img.src = p.image;
    ctx.save();
    ctx.globalAlpha = p.placed ? 0.95 : 0.85;
    ctx.shadowBlur = p.placed ? 15 : 30;
    ctx.shadowColor = p.placed ? 'rgba(0,255,200,0.2)' : 'rgba(255,255,255,0.1)';
    
    if (!p.placed) {
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x - p.w/2, p.y - p.h/2, p.w, p.h);
    }
    
    ctx.drawImage(img, p.x - p.w/2, p.y - p.h/2, p.w, p.h);
    ctx.restore();
  });
}

// ============================================================
// MEDIAPIPE RESULTS
// ============================================================
function onResults(results) {
  ctx.clearRect(0, 0, W, H);
  
  // Draw video background
  if (results.image) {
    ctx.drawImage(results.image, 0, 0, W, H);
  }
  
  let rightHand = null;
  let leftHand = null;
  
  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    for (let i = 0; i < results.multiHandLandmarks.length && i < 2; i++) {
      if (i === 0) rightHand = results.multiHandLandmarks[i];
      else if (i === 1) leftHand = results.multiHandLandmarks[i];
    }
  }
  
  const rightPinch = rightHand ? isPinch(rightHand) : false;
  const leftPinch = leftHand ? isPinch(leftHand) : false;
  
  // DETEKSI FRAME (2 tangan pinch)
  if (!dragPiece) {
    if (rightPinch && leftPinch && rightHand && leftHand) {
      const rCenter = getHandCenter(rightHand);
      const lCenter = getHandCenter(leftHand);
      
      const x = Math.min(rCenter.x, lCenter.x) * W;
      const y = Math.min(rCenter.y, lCenter.y) * H;
      const w = Math.abs(rCenter.x - lCenter.x) * W;
      const h = Math.abs(rCenter.y - lCenter.y) * H;
      
      if (w > 40 && h > 40) {
        frameBox = { x, y, w, h };
        isFrameReady = true;
        drawFrameBox(frameBox);
        statusEl.textContent = '📐 frame siap! · lepas pinch untuk capture area dalam frame';
      }
    } else {
      // Cek apakah frame sudah dibuat dan tidak ada pinch → capture
      if (isFrameReady && frameBox && !rightPinch && !leftPinch && !isCapturing && puzzleCount < 3) {
        if (currentPieces.length === 0 || placedCount === currentPieces.length) {
          captureFrame();
        } else {
          statusEl.textContent = `⚠️ Selesaikan puzzle dulu! (${placedCount}/${currentPieces.length})`;
        }
        isFrameReady = false;
      }
    }
  }
  
  // DRAG PUZZLE (1 tangan pinch)
  if (rightHand && isPinch(rightHand) && currentPieces.length > 0 && puzzleCount < 3) {
    const center = getHandCenter(rightHand);
    handleDrag({ x: center.x * W, y: center.y * H }, true);
  } else if (dragPiece) {
    handleDrag({ x: 0, y: 0 }, false);
  }
  
  // Draw pieces
  drawPieces();
  
  // Draw frame jika ada
  if (frameBox && isFrameReady && !dragPiece) {
    drawFrameBox(frameBox);
  }
  
  // Status update
  if (puzzleCount < 3) {
    if (!isFrameReady && !dragPiece && currentPieces.length > 0 && placedCount < currentPieces.length) {
      statusEl.textContent = `🧩 Susun puzzle (${placedCount}/${currentPieces.length}) · pinch & drag`;
    } else if (!isFrameReady && !dragPiece && currentPieces.length > 0 && placedCount === currentPieces.length) {
      statusEl.textContent = `✅ Foto ${puzzleCount} selesai! Buat frame untuk foto berikutnya`;
    }
  }
}

// ============================================================
// INIT MEDIAPIPE
// ============================================================
const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});
hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.6
});
hands.onResults(onResults);

// LOOP DETECTION
async function detectLoop() {
  try {
    if (video.readyState >= 2) {
      await hands.send({ image: video });
    }
  } catch (e) {}
  requestAnimationFrame(detectLoop);
}

setTimeout(detectLoop, 1000);

// ============================================================
// KEYBOARD SHORTCUT
// ============================================================
document.addEventListener('keydown', (e) => {
  if (e.key === 'c' || e.key === 'C') {
    if (isFrameReady && frameBox && (currentPieces.length === 0 || placedCount === currentPieces.length)) {
      captureFrame();
    }
  }
  if (e.key === 'r' || e.key === 'R') resetAll();
});
</script>
</body>
</html>
