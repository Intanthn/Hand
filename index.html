<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Puzzle · Frame Capture</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a12; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    #wrap {
      position: relative;
      width: 100vw; height: 100vh;
      background: #0a0a12;
      overflow: hidden;
    }
    video {
      display: block;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform: scaleX(-1);
      object-fit: cover;
      z-index: 1;
    }
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform: scaleX(-1);
      z-index: 2;
      pointer-events: none;
    }
    #status {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,215,215,0.9);
      font-size: 14px;
      background: rgba(10,10,20,0.7);
      backdrop-filter: blur(10px);
      padding: 10px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255,200,200,0.1);
      z-index: 10;
      text-align: center;
      pointer-events: none;
      font-weight: 300;
      letter-spacing: 0.5px;
    }
    #timer-display {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 120px;
      font-weight: 700;
      z-index: 10;
      text-shadow: 0 0 60px rgba(255,200,200,0.5);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      font-variant-numeric: tabular-nums;
    }
    #timer-display.show {
      opacity: 1;
    }
    #puzzle-counter {
      position: absolute;
      top: 30px;
      right: 30px;
      color: rgba(255,255,255,0.6);
      font-size: 16px;
      z-index: 10;
      text-align: right;
      pointer-events: none;
      background: rgba(0,0,0,0.4);
      padding: 8px 16px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.05);
    }
    #puzzle-counter span {
      color: white;
      font-weight: 700;
      font-size: 22px;
    }
    #complete-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(20px);
      z-index: 20;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 20px;
    }
    #complete-overlay.show {
      display: flex;
    }
    #complete-overlay h1 {
      color: white;
      font-size: 36px;
      font-weight: 300;
      letter-spacing: 4px;
    }
    #complete-overlay .strip {
      display: flex;
      gap: 12px;
      padding: 20px;
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    #complete-overlay .strip img {
      width: 120px;
      height: 160px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.2);
    }
    #complete-overlay button {
      background: #ff2d55;
      color: white;
      border: none;
      padding: 12px 40px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.2s;
    }
    #complete-overlay button:hover {
      transform: scale(1.05);
    }
    .hint {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.3);
      font-size: 11px;
      letter-spacing: 1px;
      z-index: 5;
      pointer-events: none;
      text-align: center;
    }
  </style>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  
  <div id="timer-display">3</div>
  <div id="puzzle-counter">🧩 <span id="puzzle-count">0</span> / 3</div>
  <div id="status">✧ bentuk frame dengan 2 tangan ✧</div>
  <div class="hint">pinch 2 tangan → frame · capture otomatis · susun puzzle</div>
  
  <div id="complete-overlay">
    <h1>✦ STRAP COMPLETE ✦</h1>
    <div class="strip" id="strip-container"></div>
    <button onclick="resetAll()">⟳ ULANGI</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
// ============================================================
// SETUP
// ============================================================
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const timerDisplay = document.getElementById('timer-display');
const puzzleCountEl = document.getElementById('puzzle-count');
const completeOverlay = document.getElementById('complete-overlay');
const stripContainer = document.getElementById('strip-container');

let W = 0, H = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ============================================================
// KAMERA
// ============================================================
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: 640, height: 480 }
    });
    video.srcObject = stream;
    await video.play();
  } catch (err) {
    statusEl.textContent = '⚠️ ' + err.message;
  }
}
startCamera();

// ============================================================
// STATE PUZZLE
// ============================================================
let puzzlePieces = [];
let capturedImages = [];
let puzzleCount = 0;
let isCapturing = false;
let countdown = 0;
let frameBox = null;
let isPinchingBoth = false;
let framePoints = [];
let dragPiece = null;
let dragOffset = { x: 0, y: 0 };

// ============================================================
// FUNGSI GESTUR
// ============================================================
function countFingers(lm) {
  let c = 0;
  if (lm[4].x < lm[3].x) c++;
  if (lm[8].y < lm[6].y) c++;
  if (lm[12].y < lm[10].y) c++;
  if (lm[16].y < lm[14].y) c++;
  if (lm[20].y < lm[18].y) c++;
  return c;
}

function isPinch(lm) {
  if (!lm) return false;
  const thumb = lm[4];
  const index = lm[8];
  const dist = Math.sqrt((thumb.x - index.x) ** 2 + (thumb.y - index.y) ** 2);
  return dist < 0.04;
}

function isFist(lm) {
  let curled = 0;
  const tips = [8, 12, 16, 20];
  const pips = [6, 10, 14, 18];
  for (let i = 0; i < 4; i++) {
    if (lm[tips[i]].y > lm[pips[i]].y) curled++;
  }
  return curled >= 3;
}

function getHandCenter(lm) {
  let cx = 0, cy = 0;
  for (let i = 0; i < lm.length; i++) {
    cx += lm[i].x;
    cy += lm[i].y;
  }
  return { x: cx / lm.length, y: cy / lm.length };
}

// ============================================================
// DRAW FRAME
// ============================================================
function drawFrameBox(box) {
  if (!box) return;
  const { x, y, w, h } = box;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 3;
  ctx.setLineDash([8, 6]);
  ctx.shadowBlur = 20;
  ctx.shadowColor = 'rgba(255,200,200,0.3)';
  ctx.strokeRect(x, y, w, h);
  ctx.setLineDash([]);
  
  // Corner markers
  const cornerSize = 20;
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  const corners = [
    [x, y, 1, 1], [x+w, y, -1, 1],
    [x, y+h, 1, -1], [x+w, y+h, -1, -1]
  ];
  corners.forEach(([cx, cy, dx, dy]) => {
    ctx.beginPath();
    ctx.moveTo(cx + dx * cornerSize, cy);
    ctx.lineTo(cx, cy);
    ctx.lineTo(cx, cy + dy * cornerSize);
    ctx.stroke();
  });
  ctx.restore();
}

// ============================================================
// CAPTURE & PUZZLE
// ============================================================
function captureFrame() {
  if (isCapturing || puzzleCount >= 3) return;
  if (!frameBox) {
    statusEl.textContent = '✧ bentuk frame dulu dengan 2 tangan ✧';
    return;
  }
  
  isCapturing = true;
  let count = 3;
  timerDisplay.textContent = count;
  timerDisplay.classList.add('show');
  statusEl.textContent = `📸 capture dalam ${count}...`;
  
  const interval = setInterval(() => {
    count--;
    if (count <= 0) {
      clearInterval(interval);
      timerDisplay.classList.remove('show');
      doCapture();
    } else {
      timerDisplay.textContent = count;
      statusEl.textContent = `📸 ${count}...`;
    }
  }, 800);
}

function doCapture() {
  // Capture dari video
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = 320;
  tempCanvas.height = 240;
  const tempCtx = tempCanvas.getContext('2d');
  tempCtx.drawImage(video, 0, 0, 320, 240);
  
  const imageData = tempCanvas.toDataURL('image/jpeg');
  capturedImages.push(imageData);
  
  // Buat potongan puzzle (4 potongan)
  const pieces = [];
  const cols = 2, rows = 2;
  const pw = 160, ph = 120;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const pieceCanvas = document.createElement('canvas');
      pieceCanvas.width = pw;
      pieceCanvas.height = ph;
      const pCtx = pieceCanvas.getContext('2d');
      pCtx.drawImage(tempCanvas, c * pw, r * ph, pw, ph, 0, 0, pw, ph);
      pieces.push({
        id: pieces.length,
        image: pieceCanvas.toDataURL('image/jpeg'),
        x: 100 + Math.random() * 200,
        y: 100 + Math.random() * 200,
        targetX: 100 + c * (pw + 10),
        targetY: 100 + r * (ph + 10),
        w: pw * 0.6,
        h: ph * 0.6,
        placed: false
      });
    }
  }
  
  puzzlePieces = puzzlePieces.concat(pieces);
  puzzleCount++;
  puzzleCountEl.textContent = puzzleCount;
  
  statusEl.textContent = `🧩 Potongan ${puzzleCount}/3 · susun dengan pinch & drag`;
  isCapturing = false;
  frameBox = null;
  
  if (puzzleCount >= 3) {
    setTimeout(showComplete, 500);
  }
}

// ============================================================
// DRAG PUZZLE PIECE (dengan pinch)
// ============================================================
function handleDrag(handPos, isPinching) {
  if (puzzleCount >= 3) return;
  
  if (isPinching && !dragPiece) {
    // Cari piece yang kena
    for (let i = puzzlePieces.length - 1; i >= 0; i--) {
      const p = puzzlePieces[i];
      if (p.placed) continue;
      const px = p.x * W, py = p.y * H;
      const pw = p.w * W, ph = p.h * H;
      if (handPos.x > px - pw/2 && handPos.x < px + pw/2 &&
          handPos.y > py - ph/2 && handPos.y < py + ph/2) {
        dragPiece = p;
        dragOffset.x = handPos.x - px;
        dragOffset.y = handPos.y - py;
        break;
      }
    }
  } else if (!isPinching && dragPiece) {
    // Drop: cek target
    const p = dragPiece;
    const tx = p.targetX, ty = p.targetY;
    if (Math.abs(p.x - tx) < 0.05 && Math.abs(p.y - ty) < 0.05) {
      p.placed = true;
      p.x = tx;
      p.y = ty;
      statusEl.textContent = `✅ Potongan ditempatkan! (${puzzlePieces.filter(pp => pp.placed).length}/${puzzlePieces.length})`;
    }
    dragPiece = null;
  }
  
  if (dragPiece) {
    dragPiece.x = (handPos.x - dragOffset.x) / W;
    dragPiece.y = (handPos.y - dragOffset.y) / H;
  }
}

// ============================================================
// SHOW COMPLETE
// ============================================================
function showComplete() {
  stripContainer.innerHTML = '';
  capturedImages.forEach(img => {
    const el = document.createElement('img');
    el.src = img;
    stripContainer.appendChild(el);
  });
  completeOverlay.classList.add('show');
  statusEl.textContent = '🎉 Selesai! Strap foto siap!';
}

function resetAll() {
  puzzlePieces = [];
  capturedImages = [];
  puzzleCount = 0;
  puzzleCountEl.textContent = '0';
  completeOverlay.classList.remove('show');
  frameBox = null;
  dragPiece = null;
  statusEl.textContent = '✧ bentuk frame dengan 2 tangan ✧';
}

// ============================================================
// DRAW PUZZLE PIECES
// ============================================================
function drawPieces() {
  puzzlePieces.forEach(p => {
    if (p.placed) {
      // Highlight
      ctx.save();
      ctx.shadowBlur = 20;
      ctx.shadowColor = 'rgba(0,255,200,0.2)';
      ctx.strokeStyle = 'rgba(0,255,200,0.3)';
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x * W - p.w*W/2, p.y * H - p.h*H/2, p.w*W, p.h*H);
      ctx.restore();
    }
    
    const img = new Image();
    img.src = p.image;
    ctx.save();
    ctx.globalAlpha = p.placed ? 0.9 : 0.85;
    ctx.shadowBlur = p.placed ? 10 : 30;
    ctx.shadowColor = 'rgba(255,255,255,0.1)';
    ctx.drawImage(img, p.x * W - p.w*W/2, p.y * H - p.h*H/2, p.w*W, p.h*H);
    ctx.restore();
  });
}

// ============================================================
// MEDIAPIPE RESULTS
// ============================================================
function onResults(results) {
  ctx.clearRect(0, 0, W, H);
  
  // Draw video background
  if (results.image) {
    ctx.drawImage(results.image, 0, 0, W, H);
  }
  
  let rightHand = null;
  let leftHand = null;
  
  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    for (let i = 0; i < results.multiHandLandmarks.length && i < 2; i++) {
      if (i === 0) rightHand = results.multiHandLandmarks[i];
      else if (i === 1) leftHand = results.multiHandLandmarks[i];
    }
  }
  
  // DETEKSI FRAME (2 tangan pinch)
  const rightPinch = rightHand ? isPinch(rightHand) : false;
  const leftPinch = leftHand ? isPinch(leftHand) : false;
  
  if (rightPinch && leftPinch && rightHand && leftHand) {
    const rCenter = getHandCenter(rightHand);
    const lCenter = getHandCenter(leftHand);
    
    const x = Math.min(rCenter.x, lCenter.x) * W;
    const y = Math.min(rCenter.y, lCenter.y) * H;
    const w = Math.abs(rCenter.x - lCenter.x) * W;
    const h = Math.abs(rCenter.y - lCenter.y) * H;
    
    if (w > 30 && h > 30) {
      frameBox = { x, y, w, h };
      drawFrameBox(frameBox);
      statusEl.textContent = '📐 frame siap! · lepas pinch untuk capture';
    }
  } else {
    // Cek apakah frame sudah dibuat dan tidak ada pinch → capture
    if (frameBox && !rightPinch && !leftPinch && !isCapturing && puzzleCount < 3) {
      captureFrame();
    }
    frameBox = null;
  }
  
  // DRAG PUZZLE (dengan 1 tangan pinch)
  if (rightHand && isPinch(rightHand) && puzzlePieces.length > 0) {
    const center = getHandCenter(rightHand);
    handleDrag({ x: center.x * W, y: center.y * H }, true);
  } else if (dragPiece) {
    handleDrag({ x: 0, y: 0 }, false);
  }
  
  // Draw pieces
  drawPieces();
  
  // Draw frame points
  if (frameBox) {
    drawFrameBox(frameBox);
  }
  
  // Status update
  if (!frameBox && puzzleCount < 3 && !isCapturing) {
    if (!rightHand || !leftHand) {
      statusEl.textContent = '✧ gunakan 2 tangan untuk bikin frame ✧';
    }
  }
}

// ============================================================
// INIT MEDIAPIPE
// ============================================================
const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});
hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.6
});
hands.onResults(onResults);

// LOOP DETECTION
async function detectLoop() {
  try {
    if (video.readyState >= 2) {
      await hands.send({ image: video });
    }
  } catch (e) {}
  requestAnimationFrame(detectLoop);
}

setTimeout(detectLoop, 1000);

// ============================================================
// KEYBOARD SHORTCUT (buat testing)
// ============================================================
document.addEventListener('keydown', (e) => {
  if (e.key === 'c' || e.key === 'C') {
    if (frameBox) captureFrame();
  }
  if (e.key === 'r' || e.key === 'R') resetAll();
});
</script>
</body>
</html>
